[package]
name = "litecord-desktop"
description = "Litecord native workspace, demo, MCP server and database status"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "litecord"
path = "src/main.rs"

[dependencies]
discord-adapter = { workspace = true, optional = true }
litecord-ui = { workspace = true, optional = true }
litecord-core.workspace = true
litecord-store.workspace = true
litecord-app.workspace = true
litecord-mcp.workspace = true
litecord-agent.workspace = true
litecord-harness.workspace = true
serde.workspace = true
litecord-types.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[features]
default = []
gui = ["dep:litecord-ui", "omni-codex", "omni-opencode"]
# Omni harness drivers (the harness binaries themselves are not bundled).
omni-codex = ["litecord-harness/codex"]
omni-opencode = ["litecord-harness/opencode"]
screenshots = ["gui", "litecord-ui/screenshots"]
# Real application-bot source; enabled at runtime by LITECORD_BOT_TOKEN.
discord-bot = ["dep:discord-adapter", "discord-adapter/discord-bot"]
