[package]
name = "litecord-ui"
description = "Native mock-aligned Litecord workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
screenshots = ["dep:image"]
browser-login = ["dep:wry", "dep:url", "dep:tempfile", "dep:getrandom", "dep:zeroize"]

[dependencies]
litecord-app.workspace = true
litecord-core.workspace = true
litecord-types.workspace = true
litecord-features.workspace = true
litecord-layout.workspace = true
litecord-actions.workspace = true
tokio.workspace = true
serde_json.workspace = true
eframe = { version = "=0.34.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Local wall-clock time for timestamps (the store keeps UTC).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"], optional = true }
url = { version = "2.5", optional = true }
tempfile = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
zeroize = { version = "1.8", optional = true }

[lints]
workspace = true

[dev-dependencies]
discord-adapter.workspace = true
# Match the Windows accessibility consumer to catch invalid focus targets.
accesskit_consumer = "=0.35.0"
